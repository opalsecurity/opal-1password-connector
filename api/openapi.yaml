        example: my-custom-app
        explode: true
        in: query
        name: app_id
        required: true
        schema:
          type: string
        style: form
      - description: "For connectors that support hierarchical resources, this param\
          \ will be passed to get the children of the specified parent resource."
        example: f454d283-ca67-4a8a-bdbb-df212eca5353
        explode: true
        in: query
        name: parent_id
        required: false
        schema:
          type: string
        style: form
      responses:
