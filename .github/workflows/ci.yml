name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint charts/opal-1password-connector --set fake=true --set secret.opalSigningSecret=ci
      - run: helm template ci charts/opal-1password-connector --set fake=true --set secret.opalSigningSecret=ci
      - name: Chart supplies op from the pinned 1password/op image
        run: |
          helm template ci charts/opal-1password-connector --set fake=true --set secret.opalSigningSecret=ci \
            | grep -E 'image: "1password/op:[0-9.]+@sha256:[0-9a-f]{64}"'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image doesn't bundle `op`; check the Compose wiring supplies the pinned CLI on PATH.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/opalsecurity/opal-1password-connector:ci
          cache-from: type=gha
      - name: Compose smoke test
        working-directory: deploy/docker-compose
        env:
          CONNECTOR_VERSION: ci
        run: |
          printf 'OP_FAKE=1\nOPAL_SIGNING_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --wait connector
          test "$(docker compose exec -T connector op --version)" = "$(grep -oE '1password/op:[0-9.]+' docker-compose.yml | cut -d: -f2)"
          curl -fsS http://127.0.0.1:8080/healthz
          # Re-running op-cli (an upgrade) must succeed while an `op daemon` holds the binary open.
          docker compose exec -T connector op account list --format=json
          docker compose up -d --wait connector
          ! docker run --rm --entrypoint sh ghcr.io/opalsecurity/opal-1password-connector:ci -c 'test -e /usr/local/bin/op'
