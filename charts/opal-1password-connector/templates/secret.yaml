{{- if .Values.secret.create }}
{{- /* Generate the signing secret on first install so it can be pasted into Opal, and keep it across upgrades. */}}
{{- $signingSecret := .Values.secret.opalSigningSecret }}
{{- if not $signingSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "connector.fullname" .) }}
{{- if and $existing (hasKey ($existing.data | default dict) "OPAL_SIGNING_SECRET") }}
{{- $signingSecret = index $existing.data "OPAL_SIGNING_SECRET" | b64dec }}
{{- else }}
{{- $signingSecret = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.fullname" . }}
  labels:
    {{- include "connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPAL_SIGNING_SECRET: {{ $signingSecret | quote }}
  {{- if not .Values.fake }}
  OP_EMAIL: {{ required "secret.opEmail is required" .Values.secret.opEmail | quote }}
  OP_SECRET_KEY: {{ required "secret.opSecretKey is required" .Values.secret.opSecretKey | quote }}
  OP_PASSWORD: {{ required "secret.opPassword is required" .Values.secret.opPassword | quote }}
  {{- end }}
{{- end }}
